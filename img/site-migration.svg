<linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#0f5f73"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0e1b26" flood-opacity=".14"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
</defs>
<rect width="960" height="440" rx="28" fill="#f6f1e8"/>
<circle cx="140" cy="80" r="70" fill="#e7e0d4" opacity=".6"/>
<circle cx="840" cy="370" r="90" fill="#14b8a6" opacity=".10"/>

