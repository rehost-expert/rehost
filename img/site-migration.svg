<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="mt md">
<title id="mt">An old website moving to a new, modern website</title>
<desc id="md">On the left, a dated, broken website with a security warning. A curved teal arrow carries it to a fresh, mobile-friendly site with a secure padlock on the right.</desc>
<defs>
